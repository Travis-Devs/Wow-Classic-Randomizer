document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

100vh;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  padding: 60px 24px 100px;\n}\n\n/* ── HEADER ── */\nheader {\n  text-align: center;\n  margin-bottom: 52px;\n}\n\n.eyebrow {\n  font-family: 'Cinzel', serif;\n  font-size: 10px;\n  letter-spacing: 7px;\n  text-transform: uppercase;\n  color: var(--text-dim);\n  margin-bottom: 16px;\n}\n\nh1 {\n  font-family: 'Cinzel', serif;\n  font-size: clamp(3rem, 7vw, 5.2rem);\n  font-weight: 700;\n  letter-spacing: 10px;\n  text-transform: uppercase;\n  line-height: 1;\n  margin-bottom: 10px;\n  background: linear-gradient(180deg,\n    #fff8d8 0%,\n    var(--gold-bright) 22%,\n    var(--gold) 58%,\n    #7a5818 100%\n  );\n  -webkit-background-clip: text;\n  -webkit-text-fill-color: transparent;\n  background-clip: text;\n  filter: drop-shadow(0 2px 24px rgba(200, 148, 36, 0.38));\n}\n\n.tagline {\n  font-family: 'Cinzel', serif;\n  font-size: 11px;\n  letter-spacing: 4px;\n  text-transform: uppercase;\n  color: var(--text-dim);\n  font-weight: 400;\n}\n\n/* ── FORGE PANEL ── */\n.forge-panel {\n  width: 100%;\n  max-width: 940px;\n  background: var(--panel);\n  border: 1px solid var(--border);\n  border-radius: 20px;\n  padding: 44px 50px 40px;\n  position: relative;\n  box-shadow:\n    0 0 0 1px rgba(70, 50, 4, 0.22),\n    0 10px 70px rgba(0, 0, 0, 0.9),\n    inset 0 1px 0 rgba(210, 168, 60, 0.1),\n    inset 0 0 120px rgba(0, 0, 0, 0.35);\n}\n\n/* top shimmer */\n.forge-panel::before {\n  content: '';\n  position: absolute;\n  top: 0; left: 80px; right: 80px;\n  height: 1px;\n  background: linear-gradient(90deg,\n    transparent 0%,\n    rgba(180, 138, 44, 0.5) 25%,\n    rgba(255, 218, 80, 0.95) 50%,\n    rgba(180, 138, 44, 0.5) 75%,\n    transparent 100%\n  );\n}\n\n/* corner ornaments */\n.corner {\n  position: absolute;\n  width: 18px; height: 18px;\n  border-color: var(--gold-dim);\n  border-style: solid;\n  opacity: 0.55;\n}\n.corner-tl { top: 10px;    left: 10px;  border-width: 1px 0 0 1px; border-radius: 4px 0 0 0; }\n.corner-tr { top: 10px;    right: 10px; border-width: 1px 1px 0 0; border-radius: 0 4px 0 0; }\n.corner-bl { bottom: 10px; left: 10px;  border-width: 0 0 1px 1px; border-radius: 0 0 0 4px; }\n.corner-br { bottom: 10px; right: 10px; border-width: 0 1px 1px 0; border-radius: 0 0 4px 0; }\n\n.forge-eyebrow {\n  font-family: 'Cinzel', serif;\n  font-size: 9px;\n  letter-spacing: 5px;\n  text-transform: uppercase;\n  color: var(--gold);\n  text-align: center;\n  opacity: 0.75;\n  margin-bottom: 38px;\n}\n\n/* ── REELS LAYOUT ── */\n.reels-row {\n  display: flex;\n  align-items: stretch;\n  gap: 0;\n  margin-bottom: 38px;\n}\n\n.reels-pair {\n  flex: 1;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\n.pair-header {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n\n.pair-title {\n  font-family: 'Cinzel', serif;\n  font-size: 9px;\n  letter-spacing: 3px;\n  text-transform: uppercase;\n  color: var(--text-dim);\n  white-space: nowrap;\n}\n\n.pair-rule {\n  flex: 1;\n  height: 1px;\n  background: linear-gradient(90deg, rgba(140, 100, 22, 0.35), transparent);\n}\n\n.pair-reels {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 18px;\n}\n\n/* center separator */\n.reels-sep {\n  width: 1px;\n  margin: 30px 30px 0;\n  flex-shrink: 0;\n  background: linear-gradient(180deg,\n    transparent 0%,\n    var(--gold-dark) 18%,\n    rgba(90, 64, 8, 0.5) 50%,\n    var(--gold-dark) 82%,\n    transparent 100%\n  );\n}\n\n/* ── REEL COL ── */\n.reel-col {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 9px;\n}\n\n.reel-label {\n  font-family: 'Cinzel', serif;\n  font-size: 8px;\n  letter-spacing: 2.5px;\n  text-transform: uppercase;\n  color: var(--text-dim);\n}\n\n/* ── REEL WINDOW ── */\n.reel-window {\n  width: 100%;\n  aspect-ratio: 1;\n  background: #040201;\n  border: 1px solid var(--border);\n  border-radius: 12px;\n  overflow: hidden;\n  position: relative;\n  box-shadow:\n    inset 0 0 50px rgba(0, 0, 0, 0.97),\n    inset 0 2px 6px rgba(0, 0, 0, 0.8);\n  transition: border-color 0.4s ease, box-shadow 0.4s ease;\n}\n\n/* inner vignette */\n.reel-window::after {\n  content: '';\n  position: absolute;\n  inset: 0;\n  border-radius: 11px;\n  background: radial-gradient(ellipse at center, transparent 48%, rgba(0,0,0,0.75) 100%);\n  pointer-events: none;\n  z-index: 4;\n}\n\n.reel-inner {\n  width: 100%;\n  height: 100%;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 14px;\n}\n\n.reel-item {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 9px;\n  width: 100%;\n}\n\n.reel-icon {\n  width: 64px;\n  height: 64px;\n  border-radius: 9px;\n  border: 1px solid rgba(130, 95, 22, 0.5);\n  image-rendering: pixelated;\n  box-shadow:\n    0 0 22px rgba(0,0,0,0.9),\n    0 0 10px rgba(200, 148, 38, 0.1);\n  display: block;\n}\n\n.reel-emoji {\n  font-size: 3em;\n  line-height: 1;\n  display: block;\n}\n\n.reel-name {\n  font-family: 'Cinzel', serif;\n  font-size: 8px;\n  letter-spacing: 1.2px;\n  color: var(--text-mid);\n  text-align: center;\n  text-transform: uppercase;\n  line-height: 1.3;\n}\n\n/* placeholder */\n.reel-placeholder {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 8px;\n  opacity: 0.22;\n}\n.reel-placeholder svg { width: 44px; height: 44px; }\n.reel-placeholder-text {\n  font-family: 'Cinzel', serif;\n  font-size: 7px;\n  letter-spacing: 3px;\n  text-transform: uppercase;\n  color: var(--gold);\n}\n\n/* spinning */\n.reel-window.spinning .reel-inner {\n  animation: reel-flicker 0.11s steps(1) infinite;\n}\n@keyframes reel-flicker {\n  0%   { filter: blur(3px) brightness(2); }\n  33%  { filter: blur(0px) brightness(0.4); }\n  66%  { filter: blur(2px) brightness(1.4); }\n  100% { filter: blur(3px) brightness(2); }\n}\n\n/* landed */\n.reel-window.landed {\n  border-color: var(--border-hi);\n  box-shadow:\n    inset 0 0 50px rgba(0, 0, 0, 0.97),\n    0 0 18px rgba(220, 172, 48, 0.32);\n}\n\n.land-anim {\n  animation: land-bounce 0.48s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards;\n}\n@keyframes land-bounce {\n  0%   { transform: translateY(-22px) scale(0.88); opacity: 0; }\n  55%  { transform: translateY(4px) scale(1.04); opacity: 1; }\n  75%  { transform: translateY(-2px) scale(0.99); }\n  100% { transform: translateY(0) scale(1); opacity: 1; }\n}\n\n/* ── ACTIONS ── */\n.forge-actions {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 14px;\n}\n\n.spin-btn {\n  background: linear-gradient(175deg,\n    #edd858 0%,\n    #c49422 18%,\n    #8a6210 55%,\n    #5a3e08 100%\n  );\n  color: #fffce4;\n  border: none;\n  outline: none;\n  border-radius: 10px;\n  padding: 18px 76px;\n  font-family: 'Cinzel', serif;\n  font-size: 12px;\n  font-weight: 700;\n  letter-spacing: 5px;\n  text-transform: uppercase;\n  cursor: pointer;\n  position: relative;\n  overflow: hidden;\n  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);\n  box-shadow:\n    0 1px 0 rgba(255, 240, 100, 0.5) inset,\n    0 -2px 0 rgba(0, 0, 0, 0.45) inset,\n    0 5px 28px rgba(160, 96, 0, 0.5),\n    0 1px 8px rgba(0, 0, 0, 0.7);\n  transition: transform 0.13s, box-shadow 0.13s, background 0.13s;\n}\n\n/* sheen highlight */\n.spin-btn::after {\n  content: '';\n  position: absolute;\n  top: 0; left: 0; right: 0;\n  height: 48%;\n  background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent);\n  pointer-events: none;\n}\n\n.spin-btn:hover:not(:disabled) {\n  background: linear-gradient(175deg,\n    #fce870 0%,\n    #daa828 18%,\n    #a07820 55%,\n    #6e4e0c 100%\n  );\n  box-shadow:\n    0 1px 0 rgba(255, 245, 130, 0.6) inset,\n    0 -2px 0 rgba(0, 0, 0, 0.45) inset,\n    0 8px 40px rgba(200, 128, 0, 0.65),\n    0 2px 12px rgba(0, 0, 0, 0.65);\n  transform: translateY(-2px);\n}\n.spin-btn:active:not(:disabled) {\n  transform: translateY(1px);\n  box-shadow:\n    0 1px 0 rgba(255, 240, 100, 0.35) inset,\n    0 -1px 0 rgba(0, 0, 0, 0.4) inset,\n    0 2px 12px rgba(130, 82, 0, 0.3);\n}\n.spin-btn:disabled {\n  opacity: 0.45;\n  cursor: not-allowed;\n  transform: none;\n}\n\n.kbd-hint {\n  font-size: 11px;\n  color: var(--text-dim);\n  letter-spacing: 0.5px;\n}\nkbd {\n  background: rgba(255,255,255,0.05);\n  border: 1px solid rgba(255,255,255,0.09);\n  border-radius: 4px;\n  padding: 1px 7px;\n  font-family: monospace;\n  font-size: 10px;\n  color: var(--text-mid);\n}\n\n/* ── RESULT CARD ── */\n.result-section {\n  width: 100%;\n  max-width: 940px;\n  margin-top: 20px;\n  opacity: 0;\n  transform: translateY(28px);\n  transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),\n              transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);\n  pointer-events: none;\n}\n.result-section.visible {\n  opacity: 1;\n  transform: translateY(0);\n  pointer-events: all;\n}\n\n.result-card {\n  background: var(--panel);\n  border: 1px solid var(--border);\n  border-radius: 18px;\n  overflow: hidden;\n  box-shadow: 0 6px 50px rgba(0,0,0,0.75);\n  position: relative;\n}\n\n/* class color top bar */\n.result-card::before {\n  content: '';\n  position: absolute;\n  top: 0; left: 0; right: 0;\n  height: 2px;\n  background: var(--class-color, var(--gold));\n  opacity: 0.75;\n  transition: background 0.5s ease;\n}\n\n.result-inner {\n  display: flex;\n  align-items: stretch;\n}\n\n/* faction stripe */\n.result-faction {\n  width: 116px;\n  flex-shrink: 0;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 10px;\n  padding: 28px 18px;\n  border-right: 1px solid var(--border);\n  background: rgba(0,0,0,0.25);\n}\n\n.faction-sigil {\n  width: 38px;\n  height: 38px;\n  border-radius: 50%;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-size: 18px;\n  background: rgba(255,255,255,0.04);\n  border: 1px solid rgba(255,255,255,0.07);\n}\n\n.faction-name {\n  font-family: 'Cinzel', serif;\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: 3px;\n  text-transform: uppercase;\n}\n.faction-name.alliance { color: var(--alliance); }\n.faction-name.horde    { color: var(--horde); }\n\n.result-body {\n  flex: 1;\n  display: flex;\n  align-items: stretch;\n}\n\n.result-group {\n  flex: 1;\n  padding: 26px 30px;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n.result-group + .result-group {\n  border-left: 1px solid var(--border);\n}\n\n.result-group-title {\n  font-family: 'Cinzel', serif;\n  font-size: 8px;\n  letter-spacing: 3.5px;\n  text-transform: uppercase;\n  color: var(--text-dim);\n}\n\n.result-row {\n  display: flex;\n  align-items: center;\n  gap: 13px;\n}\n\n.res-icon {\n  width: 38px;\n  height: 38px;\n  border-radius: 7px;\n  border: 1px solid rgba(130, 95, 22, 0.38);\n  image-rendering: pixelated;\n  flex-shrink: 0;\n  box-shadow: 0 0 12px rgba(0,0,0,0.7);\n  display: block;\n}\n\n.res-label-stack { display: flex; flex-direction: column; gap: 3px; }\n\n.res-name {\n  font-family: 'Cinzel', serif;\n  font-size: 16px;\n  font-weight: 600;\n  letter-spacing: 0.8px;\n  line-height: 1;\n  color: var(--text);\n}\n.res-sub {\n  font-size: 9px;\n  color: var(--text-dim);\n  letter-spacing: 1.5px;\n  text-transform: uppercase;\n}\n\n/* class colors */\n.cls-warrior  { color: #C79C6E; }\n.cls-paladin  { color: #F58CBA; }\n.cls-hunter   { color: #ABD473; }\n.cls-rogue    { color: #FFF569; }\n.cls-priest   { color: #e8e8e8; }\n.cls-shaman   { color: #6ab4ff; }\n.cls-mage     { color: #69CCF0; }\n.cls-warlock  { color: #a78cd4; }\n.cls-druid    { color: #FF7D0A; }\n\n.prof-name {\n  font-family: 'Cinzel', serif;\n  font-size: 15px;\n  letter-spacing: 0.5px;\n  color: #7dce7d;\n}\n\n/* ── RESPONSIVE ── */\n@media (max-width: 720px) {\n  .forge-panel { padding: 30px 22px 28px; }\n  .reels-row   { flex-direction: column; gap: 24px; }\n  .reels-sep   { display: none; }\n  .result-inner       { flex-direction: column; }\n  .result-faction     { width: 100%; border-right: none; border-bottom: 1px solid var(--border); flex-direction: row; padding: 16px 22px; gap: 12px; }\n  .result-body        { flex-direction: column; }\n  .result-group + .result-group { border-left: none; border-top: 1px solid var(--border); }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<canvas id=\"bgCanvas\"><\u002Fcanvas>\n<div class=\"bg-glow\"><\u002Fdiv>\n\n<div class=\"page\">\n\n  <header>\n    <p class=\"eyebrow\">World of Warcraft Classic<\u002Fp>\n    <h1>Randomizer<\u002Fh1>\n    <p class=\"tagline\">Let fate forge your destiny in Azeroth<\u002Fp>\n  <\u002Fheader>\n\n  <div class=\"forge-panel\">\n    <div class=\"corner corner-tl\"><\u002Fdiv>\n    <div class=\"corner corner-tr\"><\u002Fdiv>\n    <div class=\"corner corner-bl\"><\u002Fdiv>\n    <div class=\"corner corner-br\"><\u002Fdiv>\n\n    <p class=\"forge-eyebrow\">⚔&nbsp;&nbsp;&nbsp;Forge of Destiny&nbsp;&nbsp;&nbsp;⚔<\u002Fp>\n\n    <div class=\"reels-row\">\n\n      <!-- Character pair -->\n      <div class=\"reels-pair\">\n        <div class=\"pair-header\">\n          <span class=\"pair-title\">Character<\u002Fspan>\n          <div class=\"pair-rule\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pair-reels\">\n          <div class=\"reel-col\">\n            <span class=\"reel-label\">Race<\u002Fspan>\n            <div class=\"reel-window\" id=\"raceWin\">\n              <div class=\"reel-inner\" id=\"raceReel\">\n                <div class=\"reel-placeholder\">\n                  <svg viewBox=\"0 0 44 44\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n                    <circle cx=\"22\" cy=\"22\" r=\"20\" stroke=\"#c9a84c\" stroke-width=\"1\" opacity=\"0.6\"><\u002Fcircle>\n                    <path d=\"M22 12 L26 20 L22 18 L18 20 Z\" fill=\"#c9a84c\" opacity=\"0.7\"><\u002Fpath>\n                    <path d=\"M22 32 L26 24 L22 26 L18 24 Z\" fill=\"#c9a84c\" opacity=\"0.7\"><\u002Fpath>\n                    <path d=\"M12 22 L20 18 L18 22 L20 26 Z\" fill=\"#c9a84c\" opacity=\"0.5\"><\u002Fpath>\n                    <path d=\"M32 22 L24 18 L26 22 L24 26 Z\" fill=\"#c9a84c\" opacity=\"0.5\"><\u002Fpath>\n                  <\u002Fsvg>\n                  <span class=\"reel-placeholder-text\">Spin<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"reel-col\">\n            <span class=\"reel-label\">Class<\u002Fspan>\n            <div class=\"reel-window\" id=\"classWin\">\n              <div class=\"reel-inner\" id=\"classReel\">\n                <div class=\"reel-placeholder\">\n                  <svg viewBox=\"0 0 44 44\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n                    <circle cx=\"22\" cy=\"22\" r=\"20\" stroke=\"#c9a84c\" stroke-width=\"1\" opacity=\"0.6\"><\u002Fcircle>\n                    <path d=\"M22 12 L26 20 L22 18 L18 20 Z\" fill=\"#c9a84c\" opacity=\"0.7\"><\u002Fpath>\n                    <path d=\"M22 32 L26 24 L22 26 L18 24 Z\" fill=\"#c9a84c\" opacity=\"0.7\"><\u002Fpath>\n                    <path d=\"M12 22 L20 18 L18 22 L20 26 Z\" fill=\"#c9a84c\" opacity=\"0.5\"><\u002Fpath>\n                    <path d=\"M32 22 L24 18 L26 22 L24 26 Z\" fill=\"#c9a84c\" opacity=\"0.5\"><\u002Fpath>\n                  <\u002Fsvg>\n                  <span class=\"reel-placeholder-text\">Spin<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"reels-sep\"><\u002Fdiv>\n\n      <!-- Professions pair -->\n      <div class=\"reels-pair\">\n        <div class=\"pair-header\">\n          <span class=\"pair-title\">Professions<\u002Fspan>\n          <div class=\"pair-rule\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pair-reels\">\n          <div class=\"reel-col\">\n            <span class=\"reel-label\">Primary<\u002Fspan>\n            <div class=\"reel-window\" id=\"p1Win\">\n              <div class=\"reel-inner\" id=\"p1Reel\">\n                <div class=\"reel-placeholder\">\n                  <svg viewBox=\"0 0 44 44\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n                    <circle cx=\"22\" cy=\"22\" r=\"20\" stroke=\"#c9a84c\" stroke-width=\"1\" opacity=\"0.6\"><\u002Fcircle>\n                    <path d=\"M22 12 L26 20 L22 18 L18 20 Z\" fill=\"#c9a84c\" opacity=\"0.7\"><\u002Fpath>\n                    <path d=\"M22 32 L26 24 L22 26 L18 24 Z\" fill=\"#c9a84c\" opacity=\"0.7\"><\u002Fpath>\n                    <path d=\"M12 22 L20 18 L18 22 L20 26 Z\" fill=\"#c9a84c\" opacity=\"0.5\"><\u002Fpath>\n                    <path d=\"M32 22 L24 18 L26 22 L24 26 Z\" fill=\"#c9a84c\" opacity=\"0.5\"><\u002Fpath>\n                  <\u002Fsvg>\n                  <span class=\"reel-placeholder-text\">Spin<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"reel-col\">\n            <span class=\"reel-label\">Secondary<\u002Fspan>\n            <div class=\"reel-window\" id=\"p2Win\">\n              <div class=\"reel-inner\" id=\"p2Reel\">\n                <div class=\"reel-placeholder\">\n                  <svg viewBox=\"0 0 44 44\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n                    <circle cx=\"22\" cy=\"22\" r=\"20\" stroke=\"#c9a84c\" stroke-width=\"1\" opacity=\"0.6\"><\u002Fcircle>\n                    <path d=\"M22 12 L26 20 L22 18 L18 20 Z\" fill=\"#c9a84c\" opacity=\"0.7\"><\u002Fpath>\n                    <path d=\"M22 32 L26 24 L22 26 L18 24 Z\" fill=\"#c9a84c\" opacity=\"0.7\"><\u002Fpath>\n                    <path d=\"M12 22 L20 18 L18 22 L20 26 Z\" fill=\"#c9a84c\" opacity=\"0.5\"><\u002Fpath>\n                    <path d=\"M32 22 L24 18 L26 22 L24 26 Z\" fill=\"#c9a84c\" opacity=\"0.5\"><\u002Fpath>\n                  <\u002Fsvg>\n                  <span class=\"reel-placeholder-text\">Spin<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv><!-- /reels-row -->\n\n    <div class=\"forge-actions\">\n      <button class=\"spin-btn\" id=\"spinBtn\" onclick=\"spinAll()\">Forge My Destiny<\u002Fbutton>\n      <p class=\"kbd-hint\">Press <kbd>Space<\u002Fkbd> to spin<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv><!-- /forge-panel -->\n\n  <!-- Result -->\n  <section class=\"result-section\" id=\"resultSection\">\n    <div class=\"result-card\" id=\"resultCard\">\n      <div class=\"result-inner\">\n        <div class=\"result-faction\" id=\"resFaction\">\n          <div class=\"faction-sigil\" id=\"factionSigil\">⚔<\u002Fdiv>\n          <div class=\"faction-name alliance\" id=\"factionText\">Alliance<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"result-body\">\n          <div class=\"result-group\">\n            <p class=\"result-group-title\">Character<\u002Fp>\n            <div class=\"result-row\" id=\"resRace\"><\u002Fdiv>\n            <div class=\"result-row\" id=\"resClass\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"result-group\">\n            <p class=\"result-group-title\">Professions<\u002Fp>\n            <div class=\"result-row\" id=\"resP1\"><\u002Fdiv>\n            <div class=\"result-row\" id=\"resP2\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv><!-- /page -->\n\n<script>\n/* ============================================================\n   DATA\n============================================================ */\nconst CDN = 'https://wow.zamimg.com/images/wow/icons/large/';\n\nfunction getIconSrc(icon) {\n  var key = 'icon_' + icon;\n  return (window.__resources && window.__resources[key]) || (CDN + icon + '.jpg');\n}\n\nconst RACES = [\n  { name:'Human',     faction:'alliance', icon:'achievement_character_human_male',    fallback:'🧑', classes:['Warrior','Paladin','Rogue','Priest','Mage','Warlock'] },\n  { name:'Dwarf',     faction:'alliance', icon:'achievement_character_dwarf_male',    fallback:'⛏️',  classes:['Warrior','Paladin','Hunter','Rogue','Priest'] },\n  { name:'Night Elf', faction:'alliance', icon:'achievement_character_nightelf_male', fallback:'🌙', classes:['Warrior','Hunter','Rogue','Priest','Druid'] },\n  { name:'Gnome',     faction:'alliance', icon:'achievement_character_gnome_male',    fallback:'🔩', classes:['Warrior','Rogue','Mage','Warlock'] },\n  { name:'Orc',       faction:'horde',    icon:'achievement_character_orc_male',      fallback:'💚', classes:['Warrior','Hunter','Rogue','Shaman','Warlock'] },\n  { name:'Undead',    faction:'horde',    icon:'achievement_character_undead_male',   fallback:'💀', classes:['Warrior','Rogue','Priest','Mage','Warlock'] },\n  { name:'Tauren',    faction:'horde',    icon:'achievement_character_tauren_male',   fallback:'🐂', classes:['Warrior','Hunter','Shaman','Druid'] },\n  { name:'Troll',     faction:'horde',    icon:'achievement_character_troll_male',    fallback:'🗿', classes:['Warrior','Hunter','Rogue','Priest','Shaman','Mage'] },\n];\n\nconst CLASSES = [\n  { name:'Warrior',  icon:'classicon_warrior',  fallback:'⚔️',  color:'#C79C6E' },\n  { name:'Paladin',  icon:'classicon_paladin',  fallback:'🛡️',  color:'#F58CBA' },\n  { name:'Hunter',   icon:'classicon_hunter',   fallback:'🏹',  color:'#ABD473' },\n  { name:'Rogue',    icon:'classicon_rogue',    fallback:'🗡️',  color:'#FFF569' },\n  { name:'Priest',   icon:'classicon_priest',   fallback:'✨',  color:'#e8e8e8' },\n  { name:'Shaman',   icon:'classicon_shaman',   fallback:'⚡',  color:'#6ab4ff' },\n  { name:'Mage',     icon:'classicon_mage',     fallback:'🔮',  color:'#69CCF0' },\n  { name:'Warlock',  icon:'classicon_warlock',  fallback:'🔥',  color:'#a78cd4' },\n  { name:'Druid',    icon:'classicon_druid',    fallback:'🌿',  color:'#FF7D0A' },\n];\n\nconst PROFS = [\n  { name:'Alchemy',        icon:'trade_alchemy',         fallback:'⚗️'  },\n  { name:'Blacksmithing',  icon:'trade_blacksmithing',   fallback:'🔨'  },\n  { name:'Enchanting',     icon:'trade_engraving',       fallback:'🌟'  },\n  { name:'Engineering',    icon:'trade_engineering',     fallback:'⚙️'  },\n  { name:'Herbalism',      icon:'trade_herbalism',       fallback:'🌿'  },\n  { name:'Leatherworking', icon:'trade_leatherworking',  fallback:'🧵'  },\n  { name:'Mining',         icon:'trade_mining',          fallback:'⛏️'  },\n  { name:'Skinning',       icon:'inv_misc_pelt_wolf_01', fallback:'🔪'  },\n  { name:'Tailoring',      icon:'trade_tailoring',       fallback:'🧶'  },\n];\n\n/* ============================================================\n   HELPERS\n============================================================ */\nfunction pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }\nfunction rand(a, b) { return a + Math.random() * (b - a); }\n\nfunction iconImg(icon, fallback, cls) {\n  const esc = fallback.replace(/'/g, \"\\\\'\");\n  return `<img class=\"${cls}\" src=\"${CDN}${icon}.jpg\" alt=\"${fallback}\" loading=\"lazy\" onerror=\"this.outerHTML='<span class=\\\\'reel-emoji\\\\'>${esc}<\u002Fspan>'\">`;\n}\n\nfunction reelItemHTML(item, animate) {\n  return `<div class=\"reel-item${animate ? ' land-anim' : ''}\">\n    ${iconImg(item.icon, item.fallback, 'reel-icon')}\n    <span class=\"reel-name\">${item.name}<\u002Fspan>\n  <\u002Fdiv>`;\n}\n\n/* ============================================================\n   SPIN LOGIC\n============================================================ */\nfunction spinReel(winId, reelId, pool, duration, finalItem, onDone) {\n  const win  = document.getElementById(winId);\n  const reel = document.getElementById(reelId);\n  let idx = 0;\n\n  win.classList.remove('landed');\n  win.classList.add('spinning');\n\n  const iv = setInterval(() => {\n    reel.innerHTML = reelItemHTML(pool[idx++ % pool.length], false);\n  }, 105);\n\n  setTimeout(() => {\n    clearInterval(iv);\n    win.classList.remove('spinning');\n    win.classList.add('landed');\n    reel.innerHTML = reelItemHTML(finalItem, true);\n    setTimeout(() => win.classList.remove('landed'), 1300);\n    if (onDone) onDone();\n  }, duration);\n}\n\nlet spinning = false;\n\nfunction spinAll() {\n  if (spinning) return;\n  spinning = true;\n\n  const btn = document.getElementById('spinBtn');\n  btn.disabled = true;\n  btn.textContent = 'Forging\\u2026';\n\n  document.getElementById('resultSection').classList.remove('visible');\n\n  // pick results\n  const race    = pick(RACES);\n  const clsName = pick(race.classes);\n  const cls     = CLASSES.find(c => c.name === clsName);\n  const profs   = [...PROFS].sort(() => Math.random() - 0.5);\n  const p1 = profs[0], p2 = profs[1];\n\n  const total = rand(2800, 4600);\n\n  spinReel('raceWin',  'raceReel',  RACES,   total - 1200, race);\n  spinReel('classWin', 'classReel', CLASSES, total - 750,  cls);\n  spinReel('p1Win',    'p1Reel',    PROFS,   total - 320,  p1);\n  spinReel('p2Win',    'p2Reel',    PROFS,   total,        p2, () => {\n    showResult(race, cls, p1, p2);\n    btn.textContent = 'Forge Again';\n    btn.disabled    = false;\n    spinning        = false;\n  });\n}\n\n/* ============================================================\n   RESULT\n============================================================ */\nfunction showResult(race, cls, p1, p2) {\n  const card = document.getElementById('resultCard');\n  card.style.setProperty('--class-color', cls.color);\n\n  // faction\n  const isAlliance = race.faction === 'alliance';\n  document.getElementById('factionText').className  = `faction-name ${race.faction}`;\n  document.getElementById('factionText').textContent = isAlliance ? 'Alliance' : 'Horde';\n  document.getElementById('factionSigil').textContent = isAlliance ? '🦅' : '🩸';\n\n  // race\n  document.getElementById('resRace').innerHTML = `\n    ${iconImg(race.icon, race.fallback, 'res-icon')}\n    <div class=\"res-label-stack\">\n      <span class=\"res-name\">${race.name}<\u002Fspan>\n      <span class=\"res-sub\">Race<\u002Fspan>\n    <\u002Fdiv>`;\n\n  // class\n  const clsKey = cls.name.toLowerCase();\n  document.getElementById('resClass').innerHTML = `\n    ${iconImg(cls.icon, cls.fallback, 'res-icon')}\n    <div class=\"res-label-stack\">\n      <span class=\"res-name cls-${clsKey}\">${cls.name}<\u002Fspan>\n      <span class=\"res-sub\">Class<\u002Fspan>\n    <\u002Fdiv>`;\n\n  // profs\n  document.getElementById('resP1').innerHTML = `\n    ${iconImg(p1.icon, p1.fallback, 'res-icon')}\n    <span class=\"prof-name\">${p1.name}<\u002Fspan>`;\n\n  document.getElementById('resP2').innerHTML = `\n    ${iconImg(p2.icon, p2.fallback, 'res-icon')}\n    <span class=\"prof-name\">${p2.name}<\u002Fspan>`;\n\n  // reveal\n  setTimeout(() => {\n    const section = document.getElementById('resultSection');\n    section.classList.add('visible');\n    const top = section.getBoundingClientRect().top + window.pageYOffset - 80;\n    window.scrollTo({ top, behavior: 'smooth' });\n  }, 180);\n}\n\n/* ============================================================\n   KEYBOARD\n============================================================ */\ndocument.addEventListener('keydown', e => {\n  if (e.code === 'Space' && !document.getElementById('spinBtn').disabled) {\n    e.preventDefault();\n    spinAll();\n  }\n});\n\n/* ============================================================\n   EMBER PARTICLES\n============================================================ */\nconst canvas = document.getElementById('bgCanvas');\nconst ctx    = canvas.getContext('2d');\n\nfunction resizeCanvas() {\n  canvas.width  = window.innerWidth;\n  canvas.height = window.innerHeight;\n}\nresizeCanvas();\nwindow.addEventListener('resize', resizeCanvas);\n\nclass Ember {\n  constructor(scatter) {\n    this.reset(scatter);\n  }\n  reset(scatter) {\n    this.x       = Math.random() * canvas.width;\n    this.y       = scatter ? Math.random() * canvas.height : canvas.height + 8;\n    this.size    = Math.random() * 2.2 + 0.4;\n    this.vy      = -(Math.random() * 0.55 + 0.15);\n    this.vx      = (Math.random() - 0.5) * 0.28;\n    this.life    = scatter ? Math.random() * 200 : 0;\n    this.maxLife = Math.random() * 280 + 140;\n    this.hue     = 24 + Math.random() * 34;\n  }\n  update() {\n    this.x  += this.vx + Math.sin(this.life * 0.018) * 0.12;\n    this.y  += this.vy;\n    this.life++;\n    if (this.life >= this.maxLife || this.y < -8) this.reset(false);\n  }\n  draw() {\n    const alpha = Math.sin((this.life / this.maxLife) * Math.PI) * 0.38;\n    ctx.save();\n    ctx.globalAlpha  = alpha;\n    ctx.fillStyle    = `hsl(${this.hue}, 92%, 64%)`;\n    ctx.shadowBlur   = 5;\n    ctx.shadowColor  = `hsl(${this.hue}, 100%, 72%)`;\n    ctx.beginPath();\n    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);\n    ctx.fill();\n    ctx.restore();\n  }\n}\n\nconst embers = Array.from({ length: 55 }, () => new Ember(true));\n\n(function animate() {\n  ctx.clearRect(0, 0, canvas.width, canvas.height);\n  embers.forEach(e => { e.update(); e.draw(); });\n  requestAnimationFrame(animate);\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
